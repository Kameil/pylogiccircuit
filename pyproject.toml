[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogiccircuit"
version = "0.1.0"
description = "Programmatically build, auto-route, verify, simulate, and render LogicCircuit (.CircuitProject) digital circuits in Python."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kameil", email = "racovikpvpbr@gmail.com" },
]
requires-python = ">=3.10"
keywords = [
    "logiccircuit",
    "digital-logic",
    "electronics",
    "circuit-design",
    "eda",
    "autorouter",
    "simulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
preview = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "Pillow>=9.0"]

[project.scripts]
pylogiccircuit = "pylogiccircuit.cli:main"

[project.urls]
Homepage = "https://github.com/Kameil/pylogiccircuit"
Repository = "https://github.com/Kameil/pylogiccircuit"
Issues = "https://github.com/Kameil/pylogiccircuit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
